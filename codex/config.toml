model = "gpt-6-sol"
model_reasoning_effort = "medium"

[tui]
raw_output_mode = false
alternate_screen = "auto"
fullscreen_transcript = true
status_line = ["model-with-reasoning", "project-name", "git-branch", "context-remaining", "five-hour-limit", "weekly-limit"]
screen_reader_detection_done = true

[[hooks.PermissionRequest]]
matcher = ".*"

[[hooks.PermissionRequest.hooks]]
type = "command"
command = 'bash "$HOME/.local/bin/agent-notify.sh" --provider codex'
async = true

[plugins."interview-dev-loop@interview-dev-loop"]
enabled = true
