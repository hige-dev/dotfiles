name: 設定の検証
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 検証用ツールを導入
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y zsh tmux jq
          else
            brew install zsh tmux jq
          fi
      - name: シェル設定と配置を検証
        run: bash tests/check.sh
