# 基本設定：プレフィックスは標準の Ctrl-b を使用
set -g default-terminal "tmux-256color"
set -g history-limit 100000
set -s escape-time 10
set -g focus-events on
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# 新しいウィンドウとペインは現在のディレクトリで開く
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 既存の配置ショートカットを維持
bind C-h select-layout even-horizontal
bind C-v select-layout even-vertical
bind r source-file ~/.tmux.conf \; display-message "設定を再読み込みしました"

# OS 別のクリップボード連携：OSC 52 による二重書き込みを防ぐ
set -s set-clipboard off
bind -T copy-mode-vi v send-keys -X begin-selection
if-shell 'command -v clip.exe >/dev/null 2>&1 || command -v pbcopy >/dev/null 2>&1 || command -v wl-copy >/dev/null 2>&1 || command -v xclip >/dev/null 2>&1' {
    # ドラッグ後も選択を保持し、クリックによる空の上書きを防ぐ
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe 'bash "$HOME/.local/bin/tmux-copy.sh"'
    unbind -T copy-mode-vi MouseDown1Pane
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'bash "$HOME/.local/bin/tmux-copy.sh"'
    bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'bash "$HOME/.local/bin/tmux-copy.sh"'
}

# 控えめな配色で、現在のウィンドウとペインを強調
set -g status-style "bg=colour235,fg=colour250"
set -g status-left-length 30
set -g status-left "#[fg=colour232,bg=colour114,bold] #S #[default] "
set -g status-right-length 60
set -g status-right "#{?client_prefix,#[fg=colour220]操作待ち #[default],} %m/%d %H:%M "
set -g status-interval 15
setw -g window-status-format " #I:#W#{?window_flags, #F,} "
setw -g window-status-current-format "#[fg=colour232,bg=colour110,bold] #I:#W#{?window_flags, #F,} #[default]"
set -g pane-border-style "fg=colour238"
# 操作中のペインは明るい緑の枠と上部のラベルで識別
set -g pane-active-border-style "fg=colour114,bold"
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=colour232,bg=colour114,bold] 操作中 #P #[default],#[fg=colour245] ペイン #P #[default]} #{pane_current_command} "
set -g message-style "bg=colour110,fg=colour232"
set -g mode-style "bg=colour110,fg=colour232"

# 非アクティブなペインの背景だけ、ほんのり明るいグレーにする
setw -g window-style "fg=default,bg=#333333"
# terminal を使い、操作中は端末本来の背景色に戻す
setw -g window-active-style "fg=default,bg=terminal"
